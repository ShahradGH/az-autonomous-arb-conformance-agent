  <text x="542" y="480" fill="#e2e8f0" font-size="15">1. Invoke-AzRestMethod POST /providers/Microsoft.ResourceGraph/resources?api-version=2022-10-01</text>
  <text x="542" y="508" fill="#e2e8f0" font-size="15">2. Invoke-AzRestMethod POST .../Microsoft.PolicyInsights/policyStates/latest/queryResults</text>
